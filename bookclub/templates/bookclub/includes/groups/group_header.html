<div class="card shadow-sm mb-4">
    <div class="card-body">
        <div class="d-flex flex-column flex-md-row justify-content-between align-items-start">
            <div class="mb-3 mb-md-0">
                <h1 class="mb-2">{{ group.name }}</h1>
                <p class="lead mb-3">{{ group.description }}</p>
                
                <div class="d-flex gap-2 mb-3">
                    <span class="badge badge-member-count">{{ members.count }} Members</span>
                    <span class="badge badge-book-count">{{ books.count }} Books</span>
                    {% if is_admin %}
                    <span class="badge badge-admin">Admin</span>
                    {% endif %}
                </div>
            </div>
            
            <div class="d-flex flex-wrap justify-content-start justify-content-md-end gap-2 align-items-start">
                <a href="{% url 'home' %}" class="btn btn-secondary">
                    <i class="bi bi-arrow-left me-1"></i>Back to Groups
                </a>

                <a href="{% url 'attribution_analytics' group.id %}" class="btn btn-outline-info">
                    <i class="bi bi-graph-up me-1"></i>Book Pick Analytics
                </a>

                {% if is_admin %}
                <div class="dropdown">
                    <button class="btn btn-outline-primary dropdown-toggle" type="button" id="groupSettingsDropdown" data-bs-toggle="dropdown" aria-expanded="false" aria-label="Group settings menu">
                        <i class="bi bi-gear me-1"></i>Group Settings
                    </button>
                    <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="groupSettingsDropdown">
                        <li>
                            <a class="dropdown-item" href="{% url 'manage_group_members' group.id %}">
                                <i class="bi bi-people me-2"></i>Manage Members
                            </a>
                        </li>
                        <li>
                            <a class="dropdown-item" href="{% url 'manage_invitations' group.id %}">
                                <i class="bi bi-envelope me-2"></i>Invitations
                            </a>
                        </li>
                        <li>
                            <a class="dropdown-item" href="{% url 'manage_member_starting_points' group.id %}">
                                <i class="bi bi-calendar-date me-2"></i>Starting Points
                            </a>
                        </li>
                    </ul>
                </div>
                {% endif %}
            </div>
        </div>
    </div>
</div>
